# systemd override agar layanan PHP-FPM (yang melayani SIPELI) selalu hidup.
# Pasang: /etc/systemd/system/php8.4-fpm.service.d/sipeli-pulih-otomatis.conf
# Lalu: systemctl daemon-reload
[Service]
# NFR-03: proses yang mati karena galat/kehabisan memori dihidupkan kembali
Restart=always
RestartSec=2
# Jangan menyerah walaupun crash berulang (mis. setelah OOM)
StartLimitIntervalSec=0
[Unit]
After=network-online.target mariadb.service
